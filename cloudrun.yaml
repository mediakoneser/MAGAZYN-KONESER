apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: koneser-wms-beta
  labels:
    cloud.google.com/location: europe-west3
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "OVOKO Fast Lister Pro & PHU U KONESERA WMS Production Beta on Google Cloud Run"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/koneser-wms-beta:latest
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: APP_URL
              value: "https://koneser-wms-beta.ai.studio"
            # Optional secrets from Google Cloud Secret Manager or direct environment variables:
            # - name: GEMINI_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       key: latest
            #       name: GEMINI_API_KEY
            - name: ALLEGRO_CLIENT_ID
              value: ""
            - name: ALLEGRO_CLIENT_SECRET
              value: ""
            - name: BASELINKER_TOKEN
              value: ""
            - name: SHOPGOLD_API_URL
              value: "https://sklep.kasacja24.com/api/v1"
            - name: SHOPGOLD_API_KEY
              value: ""
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
